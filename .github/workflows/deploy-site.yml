name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "functions/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://robotmd.dev
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Inject build-time stats
        run: node site/scripts/inject-stats.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build site (expand SSI partials)
        run: node site/build.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/_build --project-name=robotmd-dev --branch=main --commit-hash=${{ github.sha }} --commit-message="${{ github.sha }} (deploy via Actions)"

      - name: Smoke test
        run: |
          set -e
          sleep 10
          curl -sfI https://robotmd.dev/ | head -5
          body=$(curl -sf https://robotmd.dev/)
          echo "$body" | grep -q "ROBOT.md" || { echo "landing page missing keyword"; exit 1; }
          echo "$body" | grep -q '<link rel="stylesheet"' || { echo "landing page missing stylesheet link — SSI includes likely unexpanded (build step skipped?)"; exit 1; }
          echo "$body" | grep -q '<!--#include' && { echo "landing page contains raw SSI directives — build did not run"; exit 1; } || true
          echo "site live at https://robotmd.dev/"
