name: Deploy mirror-worker

on:
  push:
    branches: [main]
    paths:
      - "mirror-worker/**"
      - ".github/workflows/deploy-mirror-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-mirror-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: mirror-worker
        run: npm ci
      - name: Deploy via wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          # Separate token from the Pages-only CLOUDFLARE_API_TOKEN — Workers + KV writes
          # need their own scopes (Workers Scripts: Edit + Workers KV Storage: Edit).
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mirror-worker
          command: deploy
