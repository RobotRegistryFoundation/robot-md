name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish to PyPI (requires trusted publisher configured at pypi.org)"
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Build sdist + wheel
        working-directory: cli
        run: python -m build
      - name: Upload dist
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: cli/dist/
          if-no-files-found: error

  github-release:
    # Only fires on tag push (not workflow_dispatch).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract tag message
        id: tag
        run: |
          echo "message<<EOF" >> $GITHUB_OUTPUT
          git tag -l --format='%(contents)' ${{ github.ref_name }} >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.tag.outputs.message }}
          generate_release_notes: true
          files: dist/*
      - name: Set VERSION
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Read manifest spec version
        run: |
          MANIFEST_VERSION=$(cat cli/src/robot_md/schemas/v1/version.txt | tr -d '[:space:]')
          echo "MANIFEST_VERSION=$MANIFEST_VERSION" >> "$GITHUB_ENV"
      - name: Emit cli_version envelope
        uses: continuonai/rcan-spec/.github/actions/emit-version-tuple@v3.2.3
        with:
          project: robot-md
          ran: ${{ secrets.ROBOT_MD_RAN }}
          field: cli_version
          value: ${{ env.VERSION }}
          depends_on: '{"protocol_version":">=3.2.0","manifest_spec_version":"==${{ env.MANIFEST_VERSION }}"}'
          pq_signing_key: ${{ secrets.ROBOT_MD_MLDSA65_PRIV }}
          pq_kid: ${{ secrets.ROBOT_MD_PQ_KID }}
          ed25519_signing_key: ${{ secrets.ROBOT_MD_ED25519_PRIV }}
          ed25519_kid: ${{ secrets.ROBOT_MD_KID }}
          release_tag: ${{ github.ref_name }}
      - name: Emit manifest_spec_version envelope
        uses: continuonai/rcan-spec/.github/actions/emit-version-tuple@v3.2.3
        with:
          project: robot-md
          ran: ${{ secrets.ROBOT_MD_RAN }}
          field: manifest_spec_version
          value: ${{ env.MANIFEST_VERSION }}
          depends_on: '{"protocol_version":">=3.2.0"}'
          pq_signing_key: ${{ secrets.ROBOT_MD_MLDSA65_PRIV }}
          pq_kid: ${{ secrets.ROBOT_MD_PQ_KID }}
          ed25519_signing_key: ${{ secrets.ROBOT_MD_ED25519_PRIV }}
          ed25519_kid: ${{ secrets.ROBOT_MD_KID }}
          release_tag: ${{ github.ref_name }}

  pypi-publish:
    # Manual-only. Trigger via "Release" workflow → Run workflow →
    # publish_pypi=true. Requires PYPI_TOKEN set in the pypi environment.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_pypi == 'true'
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_TOKEN }}
