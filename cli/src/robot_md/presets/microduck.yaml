# robot-md preset: Microduck (Pollen Robotics bipedal duck robot, about 25 cm tall).
# Apply with: robot-md init --preset microduck
#
# Microduck is a Pollen Robotics robot; this preset is not affiliated with Pollen.
#
# The duck walks on a trained policy that runs on the robot. A client does not
# drive joints. It asks Pollen's `robotd` daemon for a twist (`robot.move`), a
# one-shot skill (`robot.do`), a sound (`robot.sound`) or a stop (`robot.stop`)
# over JSON-RPC. This preset declares that closed set and the limits a caller
# keeps to. It does not declare a servo bus, because nothing here owns one.
#
# SOURCES. Every number names where it was read. Short names used below:
#   duckkit      github.com/craigm26/duckkit @ 475ad52
#   duck-studio  github.com/craigm26/duck-studio @ 58422b2 (PR #72, feat/brains-kit)
#   brains-layer duck-studio docs/plans/brains-layer.md (same commit)
# A value nobody has measured on a duck says "placeholder, unmeasured".

match:
  name_hints: ["microduck"]             # hostname hint only; autodetect has no robotd probe

physics:
  type: legged                          # biped
  dof: 15                               # duckkit Sources/DuckKit/DuckModel.swift:27 (jointCount); 14 policy joints + mouth
  # Joint ids and travel only. The chain is a MuJoCo body tree (body-local Z
  # hinges, duckkit Sources/DuckKit/DuckKinematics.swift:22-23), not DH, so no
  # axis, length or DH offsets are declared here. Ids: DuckModel.swift:21-25.
  # Travel: DuckModel.swift:59-75 (radians there, degrees here), which carry
  # Pollen's robot_walk.xml ranges; mouth is the runtime's -5..30 deg
  # (DuckModel.swift:78-79). No servo ids: none are sourced.
  kinematics:
    - id: left_hip_yaw
      limits_deg: [-25, 30]
    - id: left_hip_roll
      limits_deg: [-22, 22]
    - id: left_hip_pitch
      limits_deg: [-90, 90]
    - id: left_knee
      limits_deg: [-90, 90]
    - id: left_ankle
      limits_deg: [-90, 90]
    - id: neck_pitch
      limits_deg: [-90, 60]
    - id: head_pitch
      limits_deg: [-90, 90]
    - id: head_yaw
      limits_deg: [-170, 170]
    - id: head_roll
      limits_deg: [-25, 25]
    - id: mouth
      limits_deg: [-5, 30]
    - id: right_hip_yaw
      limits_deg: [-30, 25]
    - id: right_hip_roll
      limits_deg: [-22, 22]
    - id: right_hip_pitch
      limits_deg: [-90, 90]
    - id: right_knee
      limits_deg: [-90, 90]
    - id: right_ankle
      limits_deg: [-90, 90]

drivers:
  # robot-md has no protocol for robotd. `robotd_jsonrpc` is a new name, and no
  # robot-md backend implements it yet: a gateway backend for it is later work.
  # robotd speaks JSON-RPC on a Unix socket (duck-studio
  # StudioKit/Sources/StudioKit/DuckDrive.swift:41-45, citing Pollen's
  # duck-ipc-proto). The Microduck Studio bridge relays the same lines over TCP, default
  # port 7788 (duck-studio bridge/microduck-bridge.py:60); point `port` at
  # host:7788 to go through it.
  - id: robotd
    protocol: robotd_jsonrpc
    port: /run/robotd.sock              # DuckDrive.swift:42
    model: microduck

# Capabilities mirror the planner's closed set (duck-studio
# StudioKit/Sources/StudioKit/DuckDecision.swift:22-37, kinds skill, walk, turn,
# sound). robot-md capability names are free-form `namespace.name`, so the duck's
# own skill names are used as-is under `skill.`.
capabilities:
  - move.walk                           # DuckDecision .walk(forward_m, side_m), sent as robot.move twists
  - move.turn                           # DuckDecision .turn(degrees), sent as robot.move twists
  # The robotd skill names (duck-studio StudioKit/Sources/StudioKit/RobotPlan.swift:61-66,
  # robotd 1fa8438), sent as robot.do {skill}. `sit_toggle` is also a robotd
  # skill but is left out: the app drives sit and stand itself and keeps it out
  # of a planner's skills (DuckDecider.swift:210).
  - skill.kick_left
  - skill.kick_right
  - skill.roulade
  - skill.ground_pick
  # robot.sound {tag}. Tags: alarm, greet, inquire, peck, chirp, coo, wheee
  # (duckkit Sources/DuckKit/DuckSound.swift:34-49), plus "quack"
  # (duck-studio DuckDecider.swift:213-217).
  - sound.play
  - status.report                       # read only: robot.subscribe pushes robot.state (duck-studio DuckPeer.swift:98-116)
  # Not declared: head motion. Head is not a planner output until it has its
  # own envelope rows (brains-layer:317, rule 9). Not declared: the head camera,
  # which needs per-session camera consent in Studio (brains-layer:220).

safety:
  # Stick envelope. The app's limits, not the robot's: forward, back and
  # sideways 0.3 m/s (duck-studio DuckDrive.swift:69, :74, :77), turn 1.0 rad/s
  # (DuckDrive.swift:89); brains-layer:307, rule 2. Pollen's pad envelope is
  # higher on forward and back, 0.4 m/s (duck-studio
  # StudioKit/Sources/StudioKit/Resources/DuckCards/pollen-pad-drive.json:7,
  # robotd-params 34b6e7d); this preset uses the lower app figure. robotd does
  # not clamp robot.move itself (DuckDrive.swift:84-85).
  max_linear_velocity_ms: 0.3
  max_angular_velocity_dps: 57.3        # 1.0 rad/s, DuckDrive.swift:89
  # The 2 x 2 m keep-in mat is a placeholder, unmeasured (DuckEnvelopeGate.swift:76,
  # matHalfM 1.0, listed in placeholders at :82). z is the duck's height, about
  # 0.25 m (duckkit DuckKinematics.swift:9), rounded up: placeholder, unmeasured.
  workspace_bounds_m: [2.0, 2.0, 0.3]
  envelope:
    # The same stick numbers per axis, for a gate that reads them one by one.
    # Ties to the Swift gate's limits id (duck-studio
    # StudioKit/Sources/StudioKit/DuckEnvelopeGate.swift:71-84) and its golden
    # cases (StudioKit/Tests/StudioKitTests/Fixtures/gate/golden-cases.json).
    limits_id: microduck-placeholder-v1
    max_forward_ms: 0.3                 # DuckDrive.swift:69
    max_backward_ms: 0.3                # DuckDrive.swift:74
    max_sideways_ms: 0.3                # DuckDrive.swift:77
    max_turn_rads: 1.0                  # DuckDrive.swift:89
    run_cap_real_s: 30                  # duck-studio ControlArbiter.swift:79
    run_cap_practice_s: 60              # duck-studio ControlArbiter.swift:80
  estop:
    # No hardware stop is declared: none is sourced for the Microduck.
    software: true                      # robot.stop (duck-studio DuckPeer.swift:50-51)
    # placeholder, unmeasured. Nobody has timed a stop on a real duck. 700 is
    # the bridge deadman default (bridge/microduck-bridge.py:61): the longest
    # the bridge lets a silent link keep a twist going before it sends robot.stop.
    response_ms: 700
  # A robot.move expires (DuckDrive.swift:23-25), and the bridge sends
  # robot.stop when motion lines stop arriving (bridge/microduck-bridge.py:18-22).
  failsafe_behavior: stop
  hitl_gates:
    # A real duck needs a Go at the phone before any motion (brains-layer:231).
    # A chat reply is not that Go, so both motion scopes require auth.
    - scope: move
      require_auth: true
    - scope: skill
      require_auth: true                # remote planners get no skills on a real duck in v1 (brains-layer:316)
    # Sound moves nothing and is exempt from the phone check (brains-layer:315, rule 7).
    - scope: sound
      require_auth: false

body_hints:
  identity: |
    Microduck, a bipedal duck robot from Pollen Robotics, about 25 cm tall,
    with 15 joints: two 5-joint legs, a neck and head, and a mouth. A trained
    policy on the robot does the walking. Clients talk to Pollen's robotd
    daemon over JSON-RPC, on its Unix socket or through a bridge that relays
    the same lines over TCP. This preset is not affiliated with Pollen.
  capabilities: |
    Walk and turn by twist, four one-shot skills (kick_left, kick_right,
    roulade, ground_pick), sounds from the voice bank, and a state read.
    The skills are the names robotd reports from `robot.skills`; a duck
    that reports fewer has fewer. There is no head motion, camera or
    obstacle sensing in this preset.
  # Stop and skills: brains-layer:291. Every number: see safety: above.
  safety: |
    These are limits, not a guarantee. The stick envelope is 0.3 m/s
    forward, back and sideways and 1.0 rad/s turning, the app's figures
    and below Pollen's 0.4 m/s pad envelope. robotd does not clamp a move,
    so the caller must. Moves expire, and the bridge sends a stop when
    motion lines stop. Every move and skill scope requires a person's
    confirmation from outside the chat; on a real duck that is a Go on the
    phone. A stop does not cut a skill that has started: it finishes. The
    stop time, the keep-in area and the height are placeholders nobody has
    measured. No hardware stop is declared.
