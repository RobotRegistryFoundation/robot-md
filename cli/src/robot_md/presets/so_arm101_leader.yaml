# robot-md preset — SO-ARM101 leader arm (input device for teleop).
# Same geometry as the follower, but capabilities and safety are different:
# no payload motion, torque disabled during operation, pose-stream as output.

match:
  drivers:
    protocol: feetech
    count: 6
  name_hints: ["leader"]          # bias when hardware description mentions "leader"

physics:
  type: arm
  dof: 6
  solver:
    convention: DH
    base_frame: { up: z, forward: x }
    encoder:
      steps_per_rev: 4096
    gripper:
      joint_id: gripper
      tip_offset_mm: [30, 0, 0]
      open_steps: 1700
      close_steps: 1200
  kinematics:
    - { id: shoulder_pan,  axis: z, limits_deg: [-180, 180], length_mm: 60,  a_mm: 0,   d_mm: 60, servo_id: 1, encoder_sign: 1, zero_pose_steps: 2048 }
    - { id: shoulder_lift, axis: y, limits_deg: [-90,  90],  length_mm: 125, a_mm: 125, d_mm: 0,  servo_id: 2, encoder_sign: 1, zero_pose_steps: 2048 }
    - { id: elbow_flex,    axis: y, limits_deg: [-90,  90],  length_mm: 125, a_mm: 125, d_mm: 0,  servo_id: 3, encoder_sign: 1, zero_pose_steps: 2048 }
    - { id: wrist_flex,    axis: y, limits_deg: [-90,  90],  length_mm: 60,  a_mm: 60,  d_mm: 0,  servo_id: 4, encoder_sign: 1, zero_pose_steps: 2048 }
    - { id: wrist_roll,    axis: x, limits_deg: [-180, 180], length_mm: 30,  a_mm: 30,  d_mm: 0,  servo_id: 5, encoder_sign: 1, zero_pose_steps: 2048 }
    - { id: gripper,       axis: y, limits_deg: [0,    90],  length_mm: 40,  a_mm: 0,   d_mm: 0,  servo_id: 6, encoder_sign: 1, zero_pose_steps: 1200 }

drivers:
  - id: arm_servos
    protocol: feetech
    preferred_backend: lerobot   # SP3 Rev 6: preset-internal hint, NOT copied to manifest
    port: /dev/ttyACM0
    baud_rate: 1000000
    model: STS3215
    count: 6

capabilities:
  - teleop.stream_pose
  - teleop.set_passive
  - status.report

safety:
  p66_enabled: true
  loa_enforcement: true
  max_joint_velocity_dps: 360      # leader is operator-driven, hand limits dominate
  payload_kg: 0.0                   # leader carries no payload
  estop:
    hardware: false
    software: true
    response_ms: 50
  hitl_gates:
    - scope: destructive
      require_auth: true

body_hints:
  identity: |
    SO-ARM101 leader arm. Operator-driven input device for teleoperation;
    servos run torque-off during use so the arm follows the operator's motion.
  capabilities: |
    Streams joint positions to a paired follower arm at up to ~100 Hz. Passive
    state is the default; torque re-engages for homing and snapshots.
  safety: |
    Physical operation by the teleoperator is the primary safety loop. Software
    E-stop disables torque immediately. No independent motion capability.
