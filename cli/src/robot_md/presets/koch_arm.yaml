# robot-md preset — Koch v1.1 (5-DoF arm + gripper, Dynamixel servos).
# Apply with: robot-md init --preset koch-arm
#
# The Koch arm is the canonical LeRobot teleoperation rig from Hugging Face —
# a low-cost 3D-printable 5-DoF arm with 1 gripper joint, used extensively
# for imitation-learning datasets. Uses Dynamixel XL-330 servos on a U2D2
# USB-to-TTL adapter.

match:
  drivers:
    protocol: dynamixel
  usb_hints: ["U2D2", "OpenRB"]
  name_hints: ["koch", "lerobot"]

physics:
  type: arm
  dof: 6                             # 5 arm joints + 1 gripper
  solver:
    convention: DH
    base_frame: { up: z, forward: x }
    encoder:
      steps_per_rev: 4096            # Dynamixel XL-330 native
    gripper:
      joint_id: gripper
      tip_offset_mm: [25, 0, 0]      # approximate tool-frame +x
      open_steps: 2800
      close_steps: 2100
  kinematics:
    - id: shoulder_pan
      axis: z
      limits_deg: [-180, 180]
      length_mm: 55                  # base height to shoulder joint
      a_mm: 0
      d_mm: 55
      servo_id: 1
      encoder_sign: 1
      zero_pose_steps: 2048
    - id: shoulder_lift
      axis: y
      limits_deg: [-90, 90]
      length_mm: 120
      a_mm: 120
      d_mm: 0
      servo_id: 2
      encoder_sign: 1
      zero_pose_steps: 2048
    - id: elbow
      axis: y
      limits_deg: [-110, 110]
      length_mm: 120
      a_mm: 120
      d_mm: 0
      servo_id: 3
      encoder_sign: 1
      zero_pose_steps: 2048
    - id: wrist_flex
      axis: y
      limits_deg: [-90, 90]
      length_mm: 45
      a_mm: 45
      d_mm: 0
      servo_id: 4
      encoder_sign: 1
      zero_pose_steps: 2048
    - id: wrist_roll
      axis: x
      limits_deg: [-180, 180]
      length_mm: 30
      a_mm: 30
      d_mm: 0
      servo_id: 5
      encoder_sign: 1
      zero_pose_steps: 2048
    - id: gripper
      axis: y
      limits_deg: [0, 90]
      length_mm: 35
      a_mm: 0                        # passive in FK
      d_mm: 0
      servo_id: 6
      encoder_sign: 1
      zero_pose_steps: 2100

drivers:
  - id: arm_servos
    protocol: dynamixel
    port: /dev/ttyUSB0               # U2D2 default — operator overrides
    baud_rate: 1000000
    model: XL-330-M077-T
    count: 6

capabilities:
  - arm.pick
  - arm.place
  - arm.reach
  - arm.home
  - teleop.follow                    # leader-follower capability — core to Koch
  - status.report

safety:
  p66_enabled: true
  loa_enforcement: true
  max_joint_velocity_dps: 180
  payload_kg: 0.1                    # desktop scale; soft-body + 3D-printed
  estop:
    hardware: false
    software: true
    response_ms: 100
  hitl_gates:
    - scope: destructive
      require_auth: true

body_hints:
  identity: |
    Koch v1.1 — 5-DoF desktop-scale arm + gripper, 3D-printed frame with
    Dynamixel XL-330 servos. The canonical LeRobot teleoperation hardware.
    Stationary, workspace ~300 mm radius, payload ≤ 100 g.
  capabilities: |
    Pick, place, reach within the 300 mm workspace. Supports leader-follower
    teleop when paired with a second Koch arm — key for imitation-learning
    dataset collection. Gripper is joint 6.
  safety: |
    Software e-stop at 100 ms. Frame is plastic and payload is light — the
    arm will stall before it hurts anything, but destructive and system-scope
    actions still require human approval via the RCAN AUTHORIZE flow.
