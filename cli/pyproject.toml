[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robot-md"
version = "1.1.0"
description = "ROBOT.md — a single self-describing file so Claude can safely operate your robot."
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "craigm26", email = "craigm26@gmail.com" }]
keywords = ["robotics", "claude", "anthropic", "rcan", "opencastor", "robot-md"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "python-frontmatter>=1.0",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.9,<0.17",
    "ruamel.yaml>=0.18",
    "numpy>=1.24",
    "mcp>=1.0",
    "anthropic>=0.30",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "rcan[pq,crypto]>=3.3,<4",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.1.0",
]
# Optional: installs feetech_servo_sdk so `robot-md calibrate --zero` can
# talk to a physical Feetech-bus arm. Not required for schema/parse/validate.
feetech = [
    "feetech-servo-sdk>=1.0",
]
# Optional: OAK-D camera for `robot-md autodetect`'s camera probe
# and gripper-silhouette extrinsic calibration.
vision = [
    "depthai>=3.0",
]
# Optional: feetech_depthai backend for Feetech servo bus + OAK-D perception.
feetech-depthai = [
    "pyserial>=3.5",
    "depthai>=2.24",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "feetech-servo-sdk>=1.0",
]

[project.scripts]
robot-md = "robot_md.__main__:app"
robot-md-mcp = "robot_md.mcp.server:main"

[project.urls]
Homepage = "https://robotmd.dev"
Repository = "https://github.com/RobotRegistryFoundation/robot-md"
Issues = "https://github.com/RobotRegistryFoundation/robot-md/issues"
Spec = "https://robotmd.dev/spec/v1"

[project.entry-points."robot_md.backends"]
feetech_depthai = "robot_md.backends.feetech_depthai:FeetechDepthaiBackend"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_md"]
# `packages = ["src/robot_md"]` already includes schemas/ as package data —
# do NOT add a `force-include` for src/robot_md/schemas; that produces
# duplicate filenames in the wheel ZIP and PyPI Warehouse rejects it with
# "400 Invalid distribution file. ZIP archive not accepted: Duplicate
# filename in local headers."

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # Typer defines args via call-in-default (B008). This is idiomatic, not a bug.
  "B008",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
