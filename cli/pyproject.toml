[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robot-md"
version = "0.1.1"
description = "ROBOT.md — a single self-describing file so Claude can safely operate your robot."
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "craigm26", email = "craigm26@gmail.com" }]
keywords = ["robotics", "claude", "anthropic", "rcan", "opencastor", "robot-md"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "python-frontmatter>=1.0",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
robot-md = "robot_md.__main__:app"

[project.urls]
Homepage = "https://robotmd.dev"
Repository = "https://github.com/RobotRegistryFoundation/robot-md"
Issues = "https://github.com/RobotRegistryFoundation/robot-md/issues"
Spec = "https://robotmd.dev/spec/v1"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_md"]

[tool.hatch.build.targets.wheel.force-include]
"src/robot_md/schemas" = "robot_md/schemas"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # Typer defines args via call-in-default (B008). This is idiomatic, not a bug.
  "B008",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
