# Cloudflare Pages configuration for robotmd.dev
#
# Deploy options:
#
#   1. Cloudflare Dashboard (recommended for first setup):
#      - Pages > Create project > Connect to Git > RobotRegistryFoundation/robot-md
#      - Build command: node site/scripts/inject-stats.js && node site/build.mjs
#      - Output directory: site/_build
#      - Root directory: (none)
#      - Custom domain: robotmd.dev
#
#   2. Wrangler CLI (requires CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID):
#      node site/scripts/inject-stats.js && node site/build.mjs
#      npx wrangler pages deploy site/_build --project-name=robotmd-dev
#
#   3. GitHub Actions (auto-deploys on push to main):
#      See .github/workflows/deploy-site.yml
#      Requires repo secrets:
#        - CLOUDFLARE_API_TOKEN (Pages edit scope)
#        - CLOUDFLARE_ACCOUNT_ID

name = "robotmd-dev"
compatibility_date = "2024-10-01"
pages_build_output_dir = "site/_build"

# KV namespace for the Compliance-bot waitlist (Pages Function).
# To provision:
#   1. npx wrangler kv:namespace create "WAITLIST_KV"
#      → copy the returned id into the `id` field below
#   2. npx wrangler kv:namespace create "WAITLIST_KV" --preview
#      → copy the returned id into the `preview_id` field below
#   3. Commit the updated wrangler.toml and redeploy.
# Docs: https://developers.cloudflare.com/kv/get-started/
[[kv_namespaces]]
binding    = "WAITLIST_KV"
id         = "9a78bec840d049eb930a5c49f19d393a"
preview_id = "7c39ec739893442ab5b4951480010dcb"

# KV namespace for the actuator catalog mirror (Pages Function /actuators/index.json).
# Written by mirror-worker (scheduled Worker) every 10 minutes from RRF /v2/packages.
# Provisioned 2026-05-09 via:
#   npx wrangler@3.90.0 kv:namespace create MIRROR_KV
#   npx wrangler@3.90.0 kv:namespace create MIRROR_KV --preview
[[kv_namespaces]]
binding    = "MIRROR_KV"
id         = "1c143c6809104e4dbb5fc8878934ec89"
preview_id = "87c92df61b22456299feeb3db4a5b958"
